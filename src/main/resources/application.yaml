# v2.0
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 큰 요청 body(AI 표지 Base64) 허용 — 기본 2MB 제한 해제
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: bookserver
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.pkyisicmromzdocqxwgc
    password: ${SUPABASE_DB_PASSWORD} # 로컬 환경변수(SUPABASE_DB_PASSWORD)로 주입하세요. (Git 노출 방지)
    hikari:
      maximum-pool-size: 1 # 7명 이상 동시에 띄울 수 있도록 각 인원당 커넥션 개수를 1개로 제한합니다. (최대 15명 접속 가능)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false

openai:
  api-key: ${OPENAI_API_KEY:}
