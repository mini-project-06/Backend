apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookserver
  namespace: bookapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookserver
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: bookserver
    spec:
      containers:
      - name: bookserver
        image: 416225317325.dkr.ecr.ap-southeast-2.amazonaws.com/user112-bookapp-backend:d17b807fd903
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: bookserver-env
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: ""
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres.pkyisicmromzdocqxwgc"
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /api
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /api/books
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
